[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyMaxRetries = 10

[services.web]
name = "harmonicfusiondance"
description = "Main Harmonic Fusion website - static site served via nginx"
startCommand = "nginx -g 'daemon off;'"
port = 8080

[services.remark42]
name = "remark42-comments"
description = "Remark42 comment engine for blog and history pages"
image = "umputun/remark42:latest"
port = 8080
healthcheckPath = "/api/ping"
healthcheckTimeout = 30

[services.remark42.env]
# Site configuration
REMARK_URL = "https://comments.harmonicfusion.dance"
SITE = "harmonicfusiondance"
SECRET = "${{ secrets.REMARK42_SECRET }}"

# Authentication providers (enable as needed)
# ALLOWED_HOSTS = "https://harmonicfusion.dance,https://www.harmonicfusion.dance,https://blog.harmonicfusion.dance,https://history.harmonicfusion.dance"
ALLOWED_HOSTS = "https://harmonicfusion.dance,https://www.harmonicfusion.dance"
AUTH_ANON = "true"
AUTH_EMAIL = "false"
AUTH_GITHUB = "false"
AUTH_GOOGLE = "false"
AUTH_FACEBOOK = "false"

# Database
STORE_TYPE = "bolt"
STORE_BOLT_PATH = "/srv/var/db"
BACKUP_PATH = "/srv/var/backup"

# UI/UX settings
THEME = "light"
LOCALE = "en"
EMOJI = "true"
MAX_SHALLOW = "10"
SIMPLE_VIEW = "false"
SHOW_EMAIL = "false"
SHOW_COUNTERS = "true"
VOTE_MODE = "all"

# Admin
ADMIN_SHARED_ID = "${{ secrets.REMARK42_ADMIN_ID }}"
