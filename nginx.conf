# nginx configuration for Harmonic Fusion static site
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main site
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Directory redirects (/blog/{slug} → /blog/{slug}/) stay relative to the
        # public host instead of pointing at the container's port 8080.
        absolute_redirect off;

        # Cache static assets (pages link CSS and JS with a ?v= content hash)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle SPA-like routing for static pages
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Clean URLs - remove .html extension
        location /blog {
            try_files $uri $uri/ $uri.html /blog/index.html =404;
        }

        location /history {
            try_files $uri $uri/ $uri.html /history/index.html =404;
        }

        location /learning {
            try_files $uri $uri/ $uri.html /learning/index.html =404;
        }

        # Shareable event pages: /calendar/{eventId}
        location ~ ^/calendar/[^/.]+/?$ {
            try_files $uri $uri/ /calendar/event.html;
        }

        location /calendar {
            try_files $uri $uri/ $uri.html /calendar/index.html =404;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
